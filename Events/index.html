<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
  
</head>
<body>
    <h1>Events</h1>
    <div class="images">
    <ul>
      <li><img src="https://picsum.photos/200/200?random=1" alt="Random image 1"></li>
      <li><img src="https://picsum.photos/200/200?random=2" alt="Random image 2"></li>
      <li><img src="https://picsum.photos/200/200?random=3" alt="Random image 3"></li>
      <li><img src="https://picsum.photos/200/200?random=4" alt="Random image 4"></li>
      <li><img src="https://picsum.photos/200/200?random=5" alt="Random image 5"></li>
      <li><img src="https://picsum.photos/200/200?random=6" alt="Random image 6"></li>
      <li><img src="https://picsum.photos/200/200?random=7" alt="Random image 7"></li>
      <li><img src="https://picsum.photos/200/200?random=8" alt="Random image 8"></li>
      <li><img src="https://picsum.photos/200/200?random=9" alt="Random image 9"></li>
      <li><img src="https://picsum.photos/200/200?random=10" alt="Random image 10"></li>
    </ul>
  </div>
    

    <script>
        document.querySelector('.images').addEventListener('click', function(e){
        console.log(e.target.parentNode);
        let removeIt = e.target.parentNode;
        removeIt.remove();
})
    </script>
</body>
</html>
